<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mechanic Management System</title>
<style>
:root{--bg:#0b0e12;--panel:#141820;--panel2:#191e27;--line:#2a313d;--text:#f4f6f8;--muted:#9ba5b3;--accent:#f2c45b;--danger:#ff6b6b;--ok:#67d58b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{display:flex;min-height:100vh}.side{width:245px;background:#101319;border-right:1px solid var(--line);padding:20px 14px;position:fixed;inset:0 auto 0 0;z-index:5}.brand{font-weight:800;font-size:19px;padding:8px 10px 22px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#b8c0cc;text-align:left;padding:12px;border-radius:10px}.nav button.active,.nav button:hover{background:#1d232d;color:#fff}.main{margin-left:245px;width:calc(100% - 245px);padding:26px;max-width:1500px}
.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:27px}.top p{margin:5px 0 0;color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:#1b2029;color:#fff;padding:9px 13px;border-radius:9px}.btn.primary{background:#f2c45b;color:#17130a;border-color:#f2c45b;font-weight:800}.btn.danger{color:#ff9b9b}
.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:18px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}.stat{padding:16px}.stat .label{font-size:12px;color:var(--muted)}.stat b{font-size:25px;display:block;margin-top:5px}.panel{padding:18px}.panel h2{font-size:17px;margin:0 0 14px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{background:#0e1218;color:#fff;border:1px solid #333b48;border-radius:8px;padding:9px}.toolbar input{min-width:220px}
.members{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}.member{background:var(--panel2);border:1px solid var(--line);border-left:5px solid #555;border-radius:12px;padding:15px}.member.paid{box-shadow:inset 0 0 0 1px rgba(103,213,139,.15)}.member .head{display:flex;justify-content:space-between;gap:10px}.member .name{font-size:17px;font-weight:800}.rank{font-size:12px;color:var(--muted);margin-top:3px}.badge{display:inline-block;border-radius:99px;padding:3px 8px;font-size:11px;font-weight:800;margin-top:8px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.field input,.field select{width:100%}.field.full{grid-column:1/-1}.field textarea{width:100%;min-height:65px;resize:vertical}.check{display:flex;gap:7px;align-items:center;font-size:12px;white-space:nowrap}.check input{width:18px;height:18px;accent-color:var(--ok)}
.owner{border-left-color:#f2c45b;background:linear-gradient(90deg,rgba(242,196,91,.10),var(--panel2) 35%)}.chief{border-left-color:#b78cff}.first{border-left-color:#61a8ff}.second{border-left-color:#55d6c2}.mechanic{border-left-color:#70d66b}.trainee{border-left-color:#ff9d5c}
.owner .badge{color:#f2c45b;background:#2d2717}.chief .badge{color:#c9a9ff;background:#28203b}.first .badge{color:#83bcff;background:#172b45}.second .badge{color:#72e1d0;background:#17312e}.mechanic .badge{color:#8be787;background:#19301b}.trainee .badge{color:#ffb27d;background:#352318}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{color:var(--muted);font-size:11px}
.timeline{border-left:2px solid #343b47;padding-left:16px;display:grid;gap:13px}.event{position:relative}.event:before{content:"";position:absolute;left:-23px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--accent)}.event b{display:block}.event small{color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:20;padding:18px}.modal.show{display:flex}.modalbox{width:min(650px,100%);max-height:90vh;overflow:auto;background:#151a22;border:1px solid var(--line);border-radius:15px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.form .full{grid-column:1/-1}.form label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.form input,.form select,.form textarea{width:100%;background:#0e1218;color:#fff;border:1px solid #333b48;border-radius:8px;padding:10px}.form textarea{min-height:90px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;right:20px;bottom:20px;background:#202732;border:1px solid var(--line);padding:12px 15px;border-radius:10px;display:none;z-index:30}.toast.show{display:block}
.hidden{display:none!important}.empty{text-align:center;color:var(--muted);padding:35px}
@media(max-width:900px){.side{width:72px}.brand span,.brand small,.nav button span{display:none}.nav button{text-align:center}.main{margin-left:72px;width:calc(100% - 72px)}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.main{padding:15px}.top{align-items:flex-start}.top h1{font-size:22px}.stats{grid-template-columns:1fr 1fr}.fields,.form{grid-template-columns:1fr}.field.full,.form .full{grid-column:auto}.members{grid-template-columns:1fr}.toolbar input{min-width:100%}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">🔧 <span>MECHANIC</span><small>社員管理システム</small></div>
  <nav class="nav">
    <button class="active" data-page="dashboard">📊 <span>ダッシュボード</span></button>
    <button data-page="members">👥 <span>メンバー管理</span></button>
    <button data-page="bonus">💰 <span>ボーナス管理</span></button>
    <button data-page="history">📜 <span>支給履歴</span></button>
    <button data-page="promotion">📈 <span>昇格履歴</span></button>
  </nav>
</aside>

<main class="main">
<section id="dashboard" class="page">
  <div class="top"><div><h1>📊 ダッシュボード</h1><p>メカニックの現在状況をまとめて確認できます。</p></div><button class="btn primary" onclick="openMember()">＋ メンバー追加</button></div>
  <div class="grid stats" id="stats"></div>
  <div class="panel" style="margin-bottom:18px"><h2>💎 階級別ボーナス額（満額基準）</h2><div id="bonusRates" class="grid members" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"></div></div>
  <div class="panel"><h2>🔴 未支給メンバー</h2><div id="unpaidDash"></div></div>
</section>

<section id="members" class="page hidden">
  <div class="top"><div><h1>👥 メンバー管理</h1><p>名前・階級・メモ・昇格履歴を管理します。</p></div><button class="btn primary" onclick="openMember()">＋ メンバー追加</button></div>
  <div class="toolbar"><input id="memberSearch" placeholder="名前を検索"><select id="memberRank"><option value="all">全階級</option></select></div>
  <div class="grid members" id="memberList"></div>
</section>

<section id="bonus" class="page hidden">
  <div class="top"><div><h1>💰 ボーナス管理</h1><p>支給状況・金額・支給日を管理します。</p></div><button class="btn primary" onclick="newBonus()">＋ 今回のボーナス</button></div>
  <div class="toolbar"><input id="bonusSearch" placeholder="名前を検索"><select id="bonusRank"><option value="all">全階級</option></select><select id="bonusStatus"><option value="all">全員</option><option value="unpaid">未支給のみ</option><option value="paid">支給済みのみ</option></select></div>
  <div class="grid members" id="bonusList"></div>
</section>

<section id="history" class="page hidden">
  <div class="top"><div><h1>📜 支給履歴</h1><p>過去のボーナス支給記録を残します。</p></div></div>
  <div class="panel"><div class="tablewrap"><table class="table"><thead><tr><th>支給回</th><th>名前</th><th>階級</th><th>金額</th><th>支給日</th></tr></thead><tbody id="historyTable"></tbody></table></div></div>
</section>

<section id="promotion" class="page hidden">
  <div class="top"><div><h1>📈 昇格履歴</h1><p>メンバーごとの階級変更を時系列で確認できます。</p></div></div>
  <div class="panel"><div id="promotionList"></div></div>
</section>
</main>
</div>

<div class="modal" id="memberModal">
<div class="modalbox"><div class="modalhead"><h2 id="memberModalTitle">メンバー追加</h2><button class="btn" onclick="closeModal('memberModal')">✕</button></div>
<form class="form" id="memberForm">
<input type="hidden" id="editId">
<div><label>名前</label><input id="mName" required></div>
<div><label>現在の階級</label><select id="mRank"></select></div>
<div class="full"><label>管理者メモ</label><textarea id="mMemo" placeholder="勤務態度、昇格候補など"></textarea></div>
<div class="full"><label><input type="checkbox" id="mOwner"> オーナーとして登録</label></div>
</form>
<div class="modalfoot"><button class="btn" onclick="closeModal('memberModal')">キャンセル</button><button class="btn primary" onclick="saveMember()">保存</button></div>
</div></div>

<div class="modal" id="confirmModal">
<div class="modalbox"><div class="modalhead"><h2>⚠️ 支給確認</h2><button class="btn" onclick="closeModal('confirmModal')">✕</button></div>
<p id="confirmText"></p><div class="modalfoot"><button class="btn" onclick="closeModal('confirmModal')">キャンセル</button><button class="btn primary" id="confirmBtn">支給済みにする</button></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
const ranks=["オーナー","チーフ","1級整備士","2級整備士","整備士","見習い整備士"];
const bonusByRank={"オーナー":40000000,"チーフ":35000000,"1級整備士":30000000,"2級整備士":25000000,"整備士":20000000,"見習い整備士":15000000};
const defaultMembers=[
["黒崎 蓮","オーナー"],["ねむ。","チーフ"],["すばる","整備士"],["POTATO WORLD","見習い整備士"],["朔麻 千秋","見習い整備士"],["ウィリアム ヘパリン","見習い整備士"],["コウ・フォン・ヴェルデン","見習い整備士"],["九条 風太","見習い整備士"],["ぴーなっつ","見習い整備士"],["白雪 千","見習い整備士"],["楠 みのん","見習い整備士"],["三都 ごろう","見習い整備士"]
];
const key="mechanicSystemV2";
let state=JSON.parse(localStorage.getItem(key)||"null");
if(!state){
 state={members:defaultMembers.map((x,i)=>({id:Date.now()+i,name:x[0],rank:x[1],memo:"",history:[{date:today(),from:"-",to:x[1]}]})),bonusRound:1,bonuses:[]};
}
function save(){localStorage.setItem(key,JSON.stringify(state))}
function today(){return new Date().toISOString().slice(0,10)}
function yen(n){return "￥"+Number(n||0).toLocaleString("ja-JP")}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function cls(r){return {"オーナー":"owner","チーフ":"chief","1級整備士":"first","2級整備士":"second","整備士":"mechanic","見習い整備士":"trainee"}[r]||""}
function rankOptions(selected=""){return ranks.map(r=>`<option ${r===selected?"selected":""}>${r}</option>`).join("")}
function memberBonus(m){
 let b=state.bonuses.find(x=>x.memberId===m.id && x.round===state.bonusRound);
 return b||{memberId:m.id,round:state.bonusRound,amount:"",date:"",paid:false};
}
function renderStats(){
 const paid=state.members.filter(m=>memberBonus(m).paid).length;
 const total=state.members.reduce((s,m)=>s+Number(memberBonus(m).amount||0),0);
 const counts=ranks.map(r=>state.members.filter(m=>m.rank===r).length);
 document.getElementById("stats").innerHTML=[
  ["👥","総メンバー",state.members.length+"名"],["💰","今回支給済み",paid+" / "+state.members.length],["💴","今回総額",yen(total)],
  ["🔴","未支給",state.members.length-paid+"名"],["📈","今月の階級変更",state.members.reduce((s,m)=>s+(m.history.filter(h=>h.date.slice(0,7)===today().slice(0,7)&&h.from!=="-").length),0)+"件"]
 ].map(x=>`<div class="stat"><div class="label">${x[0]} ${x[1]}</div><b>${x[2]}</b></div>`).join("");
 const unpaid=state.members.filter(m=>!memberBonus(m).paid);
 document.getElementById("bonusRates").innerHTML=ranks.map(r=>`<div class="member ${cls(r)}"><div class="name">${esc(r)}</div><div style="font-size:20px;font-weight:800;margin-top:7px">${yen(bonusByRank[r])}</div><div class="rank">満額基準・固定</div></div>`).join("");
 document.getElementById("unpaidDash").innerHTML=unpaid.length?`<div class="grid members">${unpaid.map(m=>`<div class="member ${cls(m.rank)}"><div class="name">${esc(m.name)}</div><div class="rank">${esc(m.rank)}</div></div>`).join("")}</div>`:`<div class="empty">🎉 全員支給済みです！</div>`;
}
function setupFilters(){
 ["memberRank","bonusRank"].forEach(id=>{document.getElementById(id).innerHTML='<option value="all">全階級</option>'+rankOptions()});
 document.getElementById("mRank").innerHTML=rankOptions("見習い整備士");
}
function renderMembers(){
 let q=document.getElementById("memberSearch").value.toLowerCase(), r=document.getElementById("memberRank").value;
 let arr=state.members.filter(m=>(!q||m.name.toLowerCase().includes(q))&&(r==="all"||m.rank===r));
 document.getElementById("memberList").innerHTML=arr.length?arr.map(m=>`
 <div class="member ${cls(m.rank)}">
  <div class="head"><div><div class="name">${esc(m.name)}</div><div class="rank">現在：${esc(m.rank)}</div><span class="badge">${esc(m.rank)}</span></div><button class="btn" onclick="openMember(${m.id})">編集</button></div>
  <div class="rank" style="margin-top:12px">📝 ${esc(m.memo||"メモなし")}</div>
  <div style="margin-top:12px"><button class="btn" onclick="showPromotion(${m.id})">📈 昇格履歴を見る</button></div>
 </div>`).join(""):'<div class="empty">該当するメンバーはいません。</div>';
}
function renderBonus(){
 let q=document.getElementById("bonusSearch").value.toLowerCase(),r=document.getElementById("bonusRank").value,s=document.getElementById("bonusStatus").value;
 let arr=state.members.filter(m=>{let b=memberBonus(m);return(!q||m.name.toLowerCase().includes(q))&&(r==="all"||m.rank===r)&&(s==="all"||(s==="paid"?b.paid:!b.paid))});
 document.getElementById("bonusList").innerHTML=arr.length?arr.map(m=>{
  let b=memberBonus(m);
  return `<div class="member ${cls(m.rank)} ${b.paid?"paid":""}">
   <div class="head"><div><div class="name">${esc(m.name)}</div><div class="rank">${esc(m.rank)}</div><span class="badge">${b.paid?"✅ 支給済み":"🔴 未支給"}</span></div>
   <label class="check"><input type="checkbox" ${b.paid?"checked":""} onchange="togglePaid(${m.id},this.checked)"> 支給済み</label></div>
   <div class="fields">
    <div class="field"><label>支給額（階級別固定・満額）</label><input value="${yen(bonusByRank[m.rank])}" readonly></div>
    <div class="field"><label>支給日</label><input type="date" value="${esc(b.date)}" onchange="setBonus(${m.id},'date',this.value)"></div>
   </div>
  </div>`}).join(""):'<div class="empty">該当するメンバーはいません。</div>';
}
function renderHistory(){
 let rows=[];
 [...state.bonuses].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).forEach(b=>{
  if(!b.paid)return; let m=state.members.find(x=>x.id===b.memberId); if(m)rows.push(`<tr><td>第${b.round}回</td><td>${esc(m.name)}</td><td>${esc(b.rankAtPayment||m.rank)}</td><td>${yen(b.amount)}</td><td>${esc(b.date)}</td></tr>`);
 });
 document.getElementById("historyTable").innerHTML=rows.length?rows.join(""):'<tr><td colspan="5" class="empty">まだ支給履歴がありません。</td></tr>';
}
function renderPromotion(){
 document.getElementById("promotionList").innerHTML=state.members.map(m=>`<div style="margin-bottom:25px"><h3 style="margin:0 0 12px">${esc(m.name)} <span class="badge ${cls(m.rank)}">${esc(m.rank)}</span></h3><div class="timeline">${m.history.slice().reverse().map(h=>`<div class="event"><b>${esc(h.from)} → ${esc(h.to)}</b><small>${esc(h.date)}</small></div>`).join("")}</div></div>`).join("");
}
function renderAll(){setupFilters();renderStats();renderMembers();renderBonus();renderHistory();renderPromotion()}
function showPage(id){document.querySelectorAll(".page").forEach(x=>x.classList.add("hidden"));document.getElementById(id).classList.remove("hidden");document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x.dataset.page===id));renderAll()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>showPage(b.dataset.page));
["memberSearch","memberRank","bonusSearch","bonusRank","bonusStatus"].forEach(id=>document.getElementById(id).addEventListener("input",()=>{renderMembers();renderBonus()}));
function openMember(id=null){
 document.getElementById("memberModalTitle").textContent=id?"メンバー編集":"メンバー追加";
 document.getElementById("editId").value=id||"";
 let m=state.members.find(x=>x.id==id);
 document.getElementById("mName").value=m?.name||"";document.getElementById("mRank").innerHTML=rankOptions(m?.rank||"見習い整備士");document.getElementById("mMemo").value=m?.memo||"";document.getElementById("mOwner").checked=m?.owner||m?.rank==="オーナー";
 document.getElementById("memberModal").classList.add("show");
}
function saveMember(){
 let id=document.getElementById("editId").value,name=document.getElementById("mName").value.trim(),rank=document.getElementById("mRank").value,memo=document.getElementById("mMemo").value;
 if(!name)return alert("名前を入力してください。");
 let m=state.members.find(x=>x.id==id);
 if(m){if(m.rank!==rank)m.history.push({date:today(),from:m.rank,to:rank});m.name=name;m.rank=rank;m.memo=memo;m.owner=document.getElementById("mOwner").checked}
 else state.members.push({id:Date.now(),name,rank,memo,owner:document.getElementById("mOwner").checked,history:[{date:today(),from:"-",to:rank}]});
 save();closeModal("memberModal");renderAll();toast("メンバー情報を保存しました");
}
function setBonus(id,key,value){
 let b=state.bonuses.find(x=>x.memberId===id&&x.round===state.bonusRound);
 let m=state.members.find(x=>x.id===id);
 if(!b){b={memberId:id,round:state.bonusRound,amount:bonusByRank[m.rank],date:"",paid:false,rankAtPayment:m.rank};state.bonuses.push(b)}
 b[key]=value;if(key==="amount")b.amount=String(value).replace(/[^0-9]/g,"");save();renderAll();
}
function togglePaid(id,val){
 let b=state.bonuses.find(x=>x.memberId===id&&x.round===state.bonusRound),m=state.members.find(x=>x.id===id);
 if(val){
  b=b||{memberId:id,round:state.bonusRound,amount:bonusByRank[m.rank],date:today(),paid:false,rankAtPayment:m.rank};
  b.amount=bonusByRank[m.rank]; b.rankAtPayment=m.rank;
  if(!b.date)b.date=today();
  state.bonuses=state.bonuses.filter(x=>!(x.memberId===id&&x.round===state.bonusRound));state.bonuses.push(b);
  document.getElementById("confirmText").innerHTML=`<b>${esc(m.name)}</b> にボーナスを支給済みにします。<br>金額：${yen(b.amount||0)}<br>支給日：${esc(b.date)}`;
  document.getElementById("confirmBtn").onclick=()=>{b.paid=true;save();closeModal("confirmModal");renderAll();toast("支給済みにしました");};
  document.getElementById("confirmModal").classList.add("show");
 }else{
  if(b)b.paid=false;save();renderAll();toast("未支給に戻しました");
 }
}
function newBonus(){
 if(!confirm("新しいボーナス回を開始しますか？現在の支給履歴は保存されます。"))return;
 state.bonusRound++;save();renderAll();toast("第"+state.bonusRound+"回ボーナスを開始しました");
}
function showPromotion(id){
 let m=state.members.find(x=>x.id===id);alert(m.name+" の昇格履歴\n\n"+m.history.map(h=>h.date+"　"+h.from+" → "+h.to).join("\n"));
}
function closeModal(id){document.getElementById(id).classList.remove("show")}
function toast(t){let e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200)}
function resetData(){if(confirm("全データを初期化しますか？")){localStorage.removeItem(key);location.reload()}}
renderAll();
</script>
</body>
</html>
